[package]
name = "noaa_weather_client"
version = "2.0.0"
edition.workspace = true
description = "A client library for the NOAA weather.gov API"
license.workspace = true
repository.workspace = true
keywords = ["weather", "noaa", "nws", "api"]
categories = ["api-bindings"]

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(docsrs)'] }

[dependencies]
bytes.workspace = true
jiff.workspace = true
mime.workspace = true
quick-xml = { workspace = true, features = ["serde", "serialize"] }
reqwest = { workspace = true, features = ["gzip", "json", "query"] }
schemars = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
serde_with.workspace = true
tokio = { workspace = true, features = ["time"] }
tracing.workspace = true
url.workspace = true

[features]
default = []
schemars = ["dep:schemars"]

[dev-dependencies]
regex.workspace = true
stats_alloc.workspace = true
wiremock.workspace = true
tokio = { workspace = true, features = ["full"] }
