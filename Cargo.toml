[workspace]
resolver = "2"
members = ["noaa_weather_client", "noaa_weather_cli", "noaa_weather_summary"]

[workspace.dependencies]
anyhow = "1.0.104"
assert_cmd = "2.2.2"
bytes = "1.12.1"
clap = "4.6.6"
comfy-table = "8.0.0"
crossterm = { version = "0.29", default-features = false }
insta = "1.48.0"
jiff = { version = "0.2.35", features = ["serde"] }
mime = "0.3.17"
noaa_weather_client = { path = "noaa_weather_client", default-features = false }
noaa_weather_summary = { path = "noaa_weather_summary" }
quick-xml = "0.42.0"
regex = "1.13.1"
reqwest = "0.13.4"
schemars = "1.2.2"
serde = "1.0.229"
serde_json = "1.0.151"
serde_with = "3.22.0"
stats_alloc = "0.1.10"
tempfile = "3.27.0"
tokio = "1.53.1"
tracing = "0.1.44"
url = "2.5.8"
wiremock = "0.6.5"

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
