name: Pull Request Validation

on:
    push:
        branches: ["main"]
        paths-ignore:
            - "README.md"
    pull_request:
        branches: ["main"]
        paths-ignore:
            - "README.md"

env:
    CARGO_TERM_COLOR: always

jobs:
    test:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0
                  lfs: true

            - name: Install Rust toolchain
              uses: dtolnay/rust-toolchain@stable
              with:
                  components: clippy,rustfmt

            - name: Install cargo nextest
              uses: taiki-e/install-action@cargo-nextest

            - name: Install cargo hack
              uses: taiki-e/install-action@cargo-hack

            # `release-type` is deliberately omitted so the action derives it from
            # the version in Cargo.toml against the crates.io baseline, instead of
            # being gated on a hardcoded tag that may never exist.
            - name: Check public API compatibility
              uses: obi1kenobi/cargo-semver-checks-action@v2
              with:
                  package: noaa_weather_client
                  feature-group: all-features
                  rust-toolchain: manual

            - name: Check formatting
              run: cargo fmt --all --check

            - name: Lint with clippy
              run: cargo clippy --all-targets -- -D warnings

            - name: Check feature matrix
              run: cargo hack check --workspace --each-feature --no-dev-deps

            - name: Build examples
              run: cargo build --workspace --examples --all-features

            - name: Check documentation
              run: cargo doc --workspace --no-deps --all-features
              env:
                  RUSTDOCFLAGS: "-D warnings"

            - name: Run tests
              run: cargo nextest --verbose run

            - name: Build
              run: cargo build --release

            # Packaging validates the manifests that release-plz will publish,
            # including crates.io version requirements for workspace dependencies.
            - name: Package publishable crates
              run: cargo package --workspace --locked --no-verify
