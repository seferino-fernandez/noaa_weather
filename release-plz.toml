[changelog]
body = """

## [{{ version | trim_start_matches(pat="v") }}]{%- if release_link -%}({{ release_link }}){% endif %}
_{{ timestamp | date(format="%d %B %Y") }}_
{% set breaking_commits = commits | filter(attribute="breaking", value=true) -%}
{%- if breaking_commits | length > 0 %}
### Breaking changes

{% for commit in breaking_commits -%}
* {% if commit.scope and commit.scope != package %}*({{ commit.scope }})* {% endif %}{{ commit.message | upper_first }}
{%- if commit.breaking_description and commit.breaking_description != commit.message %}

{{ commit.breaking_description | trim }}
{% endif %}
{%- endfor %}
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") -%}
{%- if group != "chore" %}
### {{ group | upper_first }}

{% for commit in commits -%}
{%- if commit.scope and commit.scope != package -%}
* *({{commit.scope}})* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}{%- if commit.links %} ({% for link in commit.links %}[{{link.text}}]({{link.href}}) {% endfor -%}){% endif %}
{% else -%}
* {% if commit.breaking %}[**breaking**] {% endif %}{{ commit.message | upper_first }}
{% endif -%}
{%- endfor %}

{%- endif %}

{%- endfor -%}
"""

commit_parsers = [
    { message = "^feat", group = "added" },
    { message = "^add", group = "added" },
    { message = "^changed", group = "changed" },
    { message = "^refactor", group = "changed" },
    { message = "^perf", group = "changed" },
    { message = "^deprecated", group = "deprecated" },
    { message = "^remove", group = "removed" },
    { message = "^fix", group = "fixed" },
    { message = "^revert", group = "fixed" },
    { message = "^security", group = "security" },
    { message = "^doc", group = "documented" },
    { message = "^update", group = "updated dependencies" },
    # Hidden from the changelog: the template skips the "chore" group.
    { message = "^test", group = "chore" },
    { message = "^ci", group = "chore" },
    { message = "^build", group = "chore" },
    { message = "^style", group = "chore" },
    { message = "^chore", group = "chore" },
    { message = "^.*", group = "other" },
]

[workspace]
release_always = false
features_always_increment_minor = true
dependencies_update = true
# `!` must be in the class or scope-less breaking commits (`feat!:`) never match,
# and the package is silently never marked releasable.
release_commits = "^(feat|fix|docs|perf|refactor|revert|test|update)[(!:]"

# Publish all three packages, but create one tag and GitHub Release for the workspace.
publish = true
changelog_update = true
git_release_enable = false
git_tag_enable = false

pr_draft = false
pr_labels = ["release"]

[[package]]
name = "noaa_weather_client"
publish = true
# One changelog for the whole workspace, at the repository root.
# Path is relative to the root Cargo.toml.
changelog_path = "CHANGELOG.md"
changelog_include = [
    "noaa_weather_cli",
    "noaa_weather_mcp",
]
git_release_enable = true
git_tag_enable = true
git_tag_name = "v{{ version }}"
git_release_name = "v{{ version }}"
version_group = "noaa_weather"

# These two have no changelog of their own: `changelog_include` above folds their
# commits into the client's changelog. Without this, release-plz would create a
# duplicate CHANGELOG.md for each.
[[package]]
name = "noaa_weather_cli"
publish = true
changelog_update = false
version_group = "noaa_weather"

[[package]]
name = "noaa_weather_mcp"
publish = true
changelog_update = false
version_group = "noaa_weather"
